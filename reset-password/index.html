<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1e4a38" />
    <title>Reset password · Wedgewood Scheduling</title>
    <script>
      // Remove the one-time token before loading any other page resources.
      const resetURL = new URL(window.location.href);
      window.__passwordResetToken = resetURL.searchParams.get('token') || '';
      resetURL.searchParams.delete('token');
      history.replaceState(history.state, '', resetURL.pathname + resetURL.search + resetURL.hash);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
